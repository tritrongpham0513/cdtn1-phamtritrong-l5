# =============================================================================
# Local Development Profile with In-Memory H2 Database
# Chạy ngay lập tức mà không cần bật Docker hay cài đặt MySQL
# =============================================================================
spring.datasource.url=jdbc:h2:mem:mekong_crm_inventory;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Hiển thị rõ câu lệnh SQL và Mệnh đề khóa SELECT ... FOR UPDATE (Tiêu chí C7 & NFR-02)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.mekongmobile.inventory=INFO

# Tự động nạp hạt giống dữ liệu từ seeds/
spring.flyway.enabled=false
app.seed.enabled=true
app.seed.path=seeds

# Bật H2 Console để xem dữ liệu trực quan tại http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

