# =============================================================================
# Mekong Mobile Smart CRM - Module L5 Kho linh kien thay the
# Spring Boot Configuration
# =============================================================================
spring.application.name=inventory-service
server.port=${PORT:8080}

# Spring Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=non_null

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.messages.encoding=UTF-8

# Flyway Database Migration (Tiêu chí S3 & C1)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Data Seeder Config (Tiêu chí C4 & C5)
app.seed.enabled=${SEED_ENABLED:true}
app.seed.path=${SEED_DATA_PATH:seeds}
