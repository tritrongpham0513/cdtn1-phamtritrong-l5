spring.application.name=inventory-service
server.port=${PORT:8080}

# Spring Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
