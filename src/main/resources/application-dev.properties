# =============================================================================
# Development Profile (dev)
# =============================================================================

# Datasource configuration (MySQL 8.x)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mekong_crm_inventory}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: validate schema created by Flyway (Tiêu chí S3)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.mekongmobile.inventory=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
