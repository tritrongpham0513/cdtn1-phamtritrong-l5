# =============================================================================
# Mekong Mobile Smart CRM - Module L5 (Spare-part Inventory)
# Component 4 - Reproducible package started with two commands (Docker Compose v2)
#
# Quick start:
#   cp .env.example .env
#   docker compose up -d --build --wait
# =============================================================================

services:
  # 1) MySQL 8.0 - Flyway creates the schema when the application starts
  mysql-db:
    image: mysql:8.0
    container_name: mekong-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mekong_crm_inventory}
      MYSQL_USER: ${MYSQL_USER:-springstudent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-springstudent}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mekong_mysql_data:/var/lib/mysql
    healthcheck:
      # Kiểm tra qua TCP + xác thực người dùng ứng dụng.
      # Không dùng `mysqladmin ping -h localhost` vì lệnh đó trả 0 ngay cả khi
      # MySQL mới chỉ chạy temporary server (port 0) trong lúc khởi tạo dữ liệu.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1' $${MYSQL_DATABASE} >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # 2) Spring Boot application (REST API + static prototype UI)
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mekong-inventory-service
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8080"
    environment:
      PORT: 8080
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-mekong_crm_inventory}
      DB_USER: ${MYSQL_USER:-springstudent}
      DB_PASSWORD: ${MYSQL_PASSWORD:-springstudent}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_DATA_PATH: ${SEED_DATA_PATH:-seeds}
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  mekong_mysql_data:
